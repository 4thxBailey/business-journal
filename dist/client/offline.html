<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Offline — 4TH AND BAILEY Business Journal</title>
  <style>
    :root {
      color-scheme: dark light;
      --brand: #0072C6;
      --bg: #0F1923;
      --fg: #C8D0DA;
      --fg-muted: #7A8796;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #F0F4F8; --fg: #1E3A52; --fg-muted: #5C7A96; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: 1.25rem; font-weight: 700; }
    p  { font-size: 0.875rem; color: var(--fg-muted); max-width: 320px; line-height: 1.6; }
    a  {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1.25rem;
      background: var(--brand);
      color: #fff;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }
    .eyebrow {
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--brand);
    }
  </style>
</head>
<body>
  <p class="eyebrow">4TH AND BAILEY Business Journal</p>
  <h1>You appear to be offline</h1>
  <p>
    Connect to the internet to load the latest business intelligence and technology news.
  </p>
  <a href="/" aria-label="Try loading the Business Journal again">Try again</a>
</body>
</html>
